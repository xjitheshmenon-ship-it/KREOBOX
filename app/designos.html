<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kreobox · DesignOS · Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0f0e0c; --surface:#16140f; --surface-2:#1c1a15; --surface-3:#24211b; --surface-4:#2d2920;
    --paper:#f5f3ed; --mute:rgba(245,243,237,0.5); --line:rgba(245,243,237,0.08); --line-2:rgba(245,243,237,0.16);
    --sienna:#c96442; --green:#6fbf7a; --amber:#d4a44a; --blue:#6b9dbd; --accent:#c96442;
  }
  html,body,#root { margin:0; height:100%; background:var(--bg); color:var(--paper); }
  body { font-family:"Geist",-apple-system,BlinkMacSystemFont,sans-serif; }
  * { box-sizing:border-box; }
</style>
</head>
<body>
<div id="root" style="height:100vh;display:flex;flex-direction:column;"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="planner-backend.jsx"></script>
<script type="text/babel" src="planner-factory-admin.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

function TabBar({ active, onChange }) {
  const tabs = [
    { id: 'studio',  label: 'Studio Planner',  icon: '📐' },
    { id: 'factory', label: 'Factory Floor',    icon: '🏭' },
    { id: 'admin',   label: 'Admin',            icon: '⚙️'  },
  ];
  return (
    <div style={{
      display: 'flex', gap: 2, padding: '10px 20px',
      background: '#0e0d0b', borderBottom: `1px solid ${bLine}`,
      flexShrink: 0,
    }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => onChange(t.id)} style={{
          padding: '7px 16px', borderRadius: 6, border: 'none', cursor: 'pointer',
          fontSize: 12, fontWeight: 600, fontFamily: '"Geist", sans-serif',
          background: active === t.id ? 'rgba(201,100,66,0.18)' : 'transparent',
          color: active === t.id ? bAccent : 'rgba(255,255,255,0.45)',
          display: 'flex', alignItems: 'center', gap: 7,
        }}>
          <span>{t.icon}</span> {t.label}
        </button>
      ))}
      <div style={{ flex: 1 }} />
      <a href="planner.html" style={{
        padding: '7px 14px', borderRadius: 6, border: `1px solid ${bLine}`,
        fontSize: 11, fontFamily: 'JetBrains Mono, monospace', color: 'rgba(255,255,255,0.35)',
        textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 6,
      }}>← Planner</a>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('studio');
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: bBg }}>
      <TabBar active={tab} onChange={setTab} />
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {tab === 'studio'  && <PlannerBackend />}
        {tab === 'factory' && <FactoryModule />}
        {tab === 'admin'   && <AdminModule />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
